name: Unit Tests

on: [ push ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: "Set up JDK"
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17
          cache: "maven"
      - name: "Run tests with Maven"
        run: ./mvnw --batch-mode verify
